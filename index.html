<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บไซต์ลับ... ห้ามเข้าใกล้</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding-top: 20vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #ff3333;
            text-shadow: 0 0 10px #ff0000;
        }

        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px #ff0000;
            transition: 0.2s;
        }

        button:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }

        /* หน้าจอผีตุ้งแช่ */
        #jumpscare-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #jumpscare-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: shake 0.1s infinite;
        }

        /* เอฟเฟกต์สั่น */
        @keyframes shake {
            0% { transform: translate(5px, 5px) rotate(0deg); }
            20% { transform: translate(-5px, -7px) rotate(-1deg); }
            40% { transform: translate(-3px, 5px) rotate(1deg); }
            60% { transform: translate(5px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -3px) rotate(1deg); }
            100% { transform: translate(-1px, 5px) -1deg; }
        }
    </style>
</head>
<body>

    <div id="main-content">
        <h1>⚠️ คำเตือน: พื้นที่อันตราย ⚠️</h1>
        <p>คุณกล้าพอที่จะกดปุ่มนี้เพื่อดูความลับหรือไม่?</p>
        <br>
        <button onclick="triggerJumpscare()">คลิกเพื่อเปิดความลับ</button>
    </div>

    <!-- ส่วนแสดงหน้าผีและเสียง -->
    <div id="jumpscare-screen">
        <!-- เปลี่ยนลิงก์รูปภาพผีได้ตามต้องการ -->
        <img src="https://i.imgur.com/3O1191t.jpg" alt="Ghost">
    </div>

    <!-- เสียงกรี๊ดสยองขวัญ (ใช้ Audio API จำลองเสียงเตือน) -->
    <script>
        function triggerJumpscare() {
            // แสดงหน้าจอผี
            const screen = document.getElementById('jumpscare-screen');
            screen.style.display = 'flex';

            // เล่นเสียงหวีดสยองขวัญ (สร้างเสียงด้วย Web Audio API แบบฉุกเฉินเพื่อให้มีเสียงร้องทันที)
            playScarySound();
        }

        function playScarySound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // สร้างเสียงร้องแหลมสูงแบบตกใจ
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.8);
            
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.8);
        }
    </script>

</body>
</html>
